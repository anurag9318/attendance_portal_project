<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Dashboard | Attendance Portal</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="app">
<aside class="side"><h2>✓ Attendance Portal</h2><nav class="nav"><a href="/student/dashboard.html">My Dashboard</a><a href="/student/attendance.html">My Attendance</a><a href="#" onclick="logout(event)">Logout</a></nav></aside>
<main class="main"><div class="top"><div><button id="menu" class="btn secondary menu">☰</button><h1>Student Dashboard</h1></div><div class="user" id="user">Student</div></div>
<div class="card"><h2 id="welcome">Welcome</h2><p class="user">Today's attendance</p><div id="today" style="font-size:28px;font-weight:800;margin:12px 0">Loading...</div><p id="msg" class="user"></p><button id="mark" class="btn primary">Mark Today's Attendance</button></div>
<div class="section grid stats"><div class="stat"><small>Recorded Days</small><strong id="total">0</strong></div><div class="stat"><small>Present</small><strong id="present">0</strong></div><div class="stat"><small>Absent</small><strong id="absent">0</strong></div><div class="stat"><small>Attendance</small><strong id="pct">0%</strong></div></div>
<div class="section card"><h2>Attendance Percentage</h2><div class="progress"><span id="bar"></span></div></div>
</main></div><script src="/js/common.js"></script><script>menu();</script>
<script>
async function load(){const me=(await api("/api/auth/me")).user;welcome.textContent="Welcome, "+me.name;user.textContent=me.name;const h=await api("/api/attendance/my-history"),s=h.stats||{};total.textContent=s.total||0;present.textContent=s.present||0;absent.textContent=s.absent||0;const pc=s.total?s.present/s.total*100:0;pct.textContent=pc.toFixed(1)+"%";bar.style.width=pc+"%";const st=await api("/api/attendance/settings"),todayDate=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata"}).format(new Date()),existing=h.history.find(x=>x.attendance_date===todayDate);if(st.settings.is_holiday){today.innerHTML='<span class="badge locked">HOLIDAY</span>';mark.style.display="none";msg.textContent="Today is a holiday: "+(st.settings.holiday_reason||"Holiday")+". Attendance cannot be marked."}else if(existing){today.innerHTML=badge(existing.status);mark.style.display="none";msg.textContent="Your attendance is already marked Present and cannot be changed."}else if(st.settings.is_finalized){today.textContent="Finalized";mark.style.display="none";msg.textContent="Today's attendance has been finalized."}else if(!st.settings.is_open){today.textContent="Not Marked";mark.style.display="none";msg.textContent="Attendance is currently closed by the administrator."}else{today.textContent="Not Marked";mark.style.display="inline-flex";msg.textContent="Attendance is open. You can mark Present once."}}
mark.onclick=async()=>{try{await api("/api/attendance/mark",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:"Present"})});toast("Attendance marked Present.");load()}catch(e){toast(e.message,true)}};load();
</script></body></html>
