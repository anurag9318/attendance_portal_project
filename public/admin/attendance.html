<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Today's Attendance | Attendance Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="app">
        <aside class="side">
            <h2>✓ Attendance Portal</h2>
            <nav class="nav"><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/attendance.html">Today's
                    Attendance</a><a href="/admin/holidays.html">Holidays</a><a
                    href="/admin/students.html">Students</a><a href="/admin/reports.html">Reports</a><a href="#"
                    onclick="logout(event)">Logout</a></nav>
        </aside>
        <main class="main">
            <div class="top">
                <div><button id="menu" class="btn secondary menu">☰</button>
                    <h1>Today's Attendance</h1>
                </div>
                <div class="user" id="user">Admin</div>
            </div>
            <div class="card">
                <div class="head">
                    <h2 id="date">Today's Attendance</h2>
                    <div id="state"></div>
                </div>
                <div class="tools"><button class="btn success" onclick="bulk('Present')">All Present</button><button
                        class="btn danger" onclick="bulk('Absent')">All Absent</button><button class="btn warning"
                        onclick="holidayDay()">Declare Holiday</button><button class="btn danger"
                        onclick="resetDay()">Reset Today</button><a id="excel" class="btn primary">Daily Excel</a></div>
                <div class="table-wrap section">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Roll</th>
                                <th>Class</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/common.js"></script>
    <script>menu();</script>
    <script>
        async function load() { const d = await api("/api/attendance/today"); date.textContent = "Attendance — " + d.date; excel.href = "/api/reports/daily/excel?date=" + d.date; state.innerHTML = d.settings.is_holiday ? '<span class="badge locked">HOLIDAY</span>' : d.settings.is_finalized ? '<span class="badge locked">FINALIZED</span>' : d.settings.is_open ? '<span class="badge open">OPEN</span>' : '<span class="badge closed">CLOSED</span>'; rows.innerHTML = d.students.map(s => `<tr><td>${esc(s.student_id)}</td><td>${esc(s.name)}</td><td>${esc(s.roll_number)}</td><td>${esc(s.class_name)}</td><td>${badge(s.status)}</td>
            <td><button class="btn success" onclick="mark(${s.id},'Present')">Present </button>
             <button class="btn danger" onclick="mark(${s.id},'Absent')">Absent</button></td></tr>`).join("") }
        async function mark(id, status) { try { await api("/api/attendance/mark", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ studentId: id, status }) }); toast("Updated"); await load() } catch (e) { toast(e.message, true) } }
        async function bulk(status) { if (!confirm(`Mark all students ${status}?`)) return; try { await api("/api/attendance/mark-all", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }) }); toast("Updated"); await load() } catch (e) { toast(e.message, true) } }
        async function resetDay() { if (!confirm("Reset TODAY only? All attendance marked today will be deleted and student attendance will reopen.")) return; try { await api("/api/attendance/reset", { method: "POST" }); toast("Today reset and reopened."); await load() } catch (e) { toast(e.message, true) } }
        async function holidayDay() { const reason = prompt("Holiday reason (optional):", "Holiday"); if (reason === null) return; try { await api("/api/attendance/holiday", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason }) }); toast("Today declared a holiday."); load() } catch (e) { toast(e.message, true) } }  load();
    </script>
</body>

</html>
