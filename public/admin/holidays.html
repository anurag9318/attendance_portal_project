<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holidays | Attendance Portal</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div class="app"><aside class="side"><h2>✓ Attendance Portal</h2><nav class="nav"><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/attendance.html">Today's Attendance</a><a href="/admin/holidays.html">Holidays</a><a href="/admin/students.html">Students</a><a href="/admin/reports.html">Reports</a><a href="#" onclick="logout(event)">Logout</a></nav></aside>
<main class="main"><div class="top"><div><button id="menu" class="btn secondary menu">☰</button><h1>Holiday Management</h1></div><div class="user" id="user">Admin</div></div>
<div class="card"><div class="head"><h2>Declare Upcoming Holiday</h2></div><div class="tools"><input id="holidayDate" class="input" type="date"><input id="reason" class="input" placeholder="Holiday reason, e.g. Diwali"></div><div class="tools"><button class="btn warning" onclick="addHoliday()">Declare Holiday</button></div><p class="user">Saturday and Sunday are always holidays and cannot be removed.</p></div>
<div class="section card"><div class="head"><h2>Upcoming Holidays</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Day</th><th>Reason</th><th>Type</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main></div><script src="/js/common.js"></script><script>menu();</script><script>
const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata"}).format(new Date());holidayDate.min=today;holidayDate.value=today;
async function load(){const d=await api("/api/attendance/holidays");rows.innerHTML=d.holidays.map(h=>{const dt=new Date(h.date+"T00:00:00Z");return `<tr><td>${esc(h.date)}</td><td>${dt.toLocaleDateString("en-IN",{weekday:"long",timeZone:"UTC"})}</td><td>${esc(h.reason)}</td><td>${h.weekend?'<span class="badge locked">WEEKEND</span>':'<span class="badge closed">ADMIN</span>'}</td><td>${h.weekend?'—':`<button class="btn secondary" onclick="removeHoliday('${h.date}')">Remove</button>`}</td></tr>`}).join("")||'<tr><td colspan="5">No upcoming holidays declared.</td></tr>'}
async function addHoliday(){const date=holidayDate.value;if(!date)return toast("Select a date.",true);try{await api("/api/attendance/holiday",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date,reason:reason.value})});toast("Holiday scheduled.");reason.value="";load()}catch(e){toast(e.message,true)}}
async function removeHoliday(date){if(!confirm(`Remove holiday for ${date}?`))return;try{await api("/api/attendance/remove-holiday",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date})});toast("Holiday removed.");load()}catch(e){toast(e.message,true)}}load();
</script></body></html>
