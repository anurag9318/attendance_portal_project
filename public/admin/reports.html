<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reports | Attendance Portal</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div class="app"><aside class="side"><h2>✓ Attendance Portal</h2><nav class="nav"><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/attendance.html">Today's Attendance</a><a href="/admin/students.html">Students</a><a href="/admin/reports.html">Reports</a><a href="#" onclick="logout(event)">Logout</a></nav></aside>
<main class="main"><div class="top"><div><button id="menu" class="btn secondary menu">☰</button><h1>Reports</h1></div><div class="user" id="user">Admin</div></div>
<div class="card"><div class="filter"><label>Daily Date<input id="dd" type="date"></label><button class="btn secondary" onclick="daily()">View</button><a id="de" class="btn primary">Daily Excel</a></div>
<div class="filter section"><label>Month<input id="mm" type="month"></label><button class="btn secondary" onclick="monthly()">View</button><a id="me" class="btn primary">Monthly Excel</a></div></div>
<div class="section card"><h2 id="title">Daily Report</h2><div class="table-wrap"><table class="table"><thead id="head"></thead><tbody id="rows"></tbody></table></div></div>
</main></div>
<script src="/js/common.js"></script><script>menu();</script>
<script>
const now=new Date(),iso=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);dd.value=iso;mm.value=iso.slice(0,7);function links(){de.href="/api/reports/daily/excel?date="+dd.value;me.href="/api/reports/monthly/excel?month="+mm.value}links();
async function daily(){try{const d=await api("/api/reports/daily?date="+dd.value);title.textContent="Daily — "+d.date;head.innerHTML="<tr><th>ID</th><th>Name</th><th>Roll</th><th>Class</th><th>Status</th><th>Marked At</th></tr>";rows.innerHTML=d.rows.map(r=>`<tr><td>${esc(r.student_id)}</td><td>${esc(r.name)}</td><td>${esc(r.roll_number)}</td><td>${esc(r.class_name)}</td><td>${badge(r.attendance_status)}</td><td>${esc(r.marked_at||"-")}</td></tr>`).join("")}catch(e){toast(e.message,true)}}async function monthly(){try{const d=await api("/api/reports/monthly?month="+mm.value),days=new Date(+mm.value.slice(0,4),+mm.value.slice(5),0).getDate(),map=new Map();d.rows.forEach(r=>{if(!map.has(r.student_id))map.set(r.student_id,{...r,days:{}});if(r.attendance_date)map.get(r.student_id).days[+String(r.attendance_date).slice(-2)]=r.status});head.innerHTML="<tr><th>ID</th><th>Name</th>"+Array.from({length:days},(_,i)=>`<th>${i+1}</th>`).join("")+"<th>P</th><th>A</th><th>%</th></tr>";rows.innerHTML=[...map.values()].map(s=>{let p=0,a=0,c="";for(let i=1;i<=days;i++){const v=s.days[i];if(v==="Present")p++;if(v==="Absent")a++;c+=`<td>${v==="Present"?"P":v==="Absent"?"A":"-"}</td>`}return `<tr><td>${esc(s.student_id)}</td><td>${esc(s.name)}</td>${c}<td>${p}</td><td>${a}</td><td>${(p+a?p/(p+a)*100:0).toFixed(1)}%</td></tr>`}).join("")}catch(e){toast(e.message,true)}}dd.onchange=links;mm.onchange=links;daily();
</script></body></html>
