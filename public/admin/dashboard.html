<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard | Attendance Portal</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div class="app"><aside class="side"><h2>✓ Attendance Portal</h2><nav class="nav"><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/attendance.html">Today's Attendance</a><a href="/admin/holidays.html">Holidays</a><a href="/admin/students.html">Students</a><a href="/admin/reports.html">Reports</a><a href="#" onclick="logout(event)">Logout</a></nav></aside>
<main class="main"><div class="top"><div><button id="menu" class="btn secondary menu">☰</button><h1>Admin Dashboard</h1></div><div class="user" id="user">Admin</div></div>
<div class="grid stats"><div class="stat"><small>Total Students</small><strong id="total">0</strong></div><div class="stat"><small>Present Today</small><strong id="present">0</strong></div><div class="stat"><small>Absent Today</small><strong id="absent">0</strong></div><div class="stat"><small>Attendance</small><strong id="pct">0%</strong></div></div>
<div class="section card"><div class="head"><h2>Attendance Control</h2><div id="state"></div></div><div class="tools"><button class="btn success" onclick="act('open')">Open</button><button class="btn warning" onclick="act('close')">Close</button><button class="btn primary" onclick="finalizeDay()">Finalize</button><button class="btn secondary" onclick="reopenDay()">Reopen</button><button class="btn danger" onclick="resetDay()">Reset Today</button><button class="btn warning" onclick="holidayDay()">Declare Holiday</button></div><p id="info" class="user"></p><p id="holiday" class="user"></p><p id="schedule" class="user"></p><a class="btn secondary" href="/admin/holidays.html">Manage Upcoming Holidays</a></div>
<div class="section card"><div class="head"><h2>Quick Actions</h2></div><div class="tools"><button class="btn success" onclick="bulk('Present')">Mark All Present</button><button class="btn danger" onclick="bulk('Absent')">Mark All Absent</button><a class="btn secondary" href="/admin/attendance.html">Manage Attendance</a></div></div>
<div class="section card"><h2>Today's Attendance</h2><div class="progress"><span id="bar"></span></div><p id="summary" class="user"></p></div>
</main></div>
<script src="/js/common.js"></script><script>menu();</script>
<script>
async function load(){const d=await api("/api/attendance/today"),s=d.stats,p=+s.present||0,a=+s.absent||0,t=+s.total||0;total.textContent=t;present.textContent=p;absent.textContent=a;pct.textContent=(t?p/t*100:0).toFixed(1)+"%";bar.style.width=(t?p/t*100:0)+"%";summary.textContent=`${p} present, ${a} absent, ${Math.max(0,t-p-a)} not marked.`;state.innerHTML=d.settings.is_holiday?'<span class="badge locked">HOLIDAY</span>':d.settings.is_finalized?'<span class="badge locked">FINALIZED</span>':d.settings.is_open?'<span class="badge open">OPEN</span>':'<span class="badge closed">CLOSED</span>';info.textContent=d.settings.is_holiday?("Holiday: "+(d.settings.holiday_reason||"Holiday")):d.settings.is_finalized?"Attendance is locked.":d.settings.is_open?"Students can mark attendance.":"Student attendance is closed.";holiday.textContent=d.settings.is_holiday?"No student attendance can be submitted today.":"";const cfg=await api("/api/attendance/settings");schedule.textContent=`Automatic schedule: Open ${cfg.schedule.open} IST and close ${cfg.schedule.close} IST${cfg.schedule.autoFinalize?"; automatic finalization is enabled.":"; automatic finalization is disabled."}`}
async function act(x){try{await api("/api/attendance/"+x,{method:"POST"});toast("Done");load()}catch(e){toast(e.message,true)}}
async function bulk(status){if(!confirm(`Mark all students ${status}?`))return;try{await api("/api/attendance/mark-all",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});toast("Bulk attendance updated.");load()}catch(e){toast(e.message,true)}}
function finalizeDay(){if(confirm("Finalize and lock today's attendance?"))act("finalize")}function reopenDay(){if(confirm("Reopen today's attendance?"))act("reopen")}
async function resetDay(){if(!confirm("Reset TODAY only? This will delete all attendance marked today and reopen the student portal."))return;try{await api("/api/attendance/reset",{method:"POST"});toast("Today reset and student portal reopened.");load()}catch(e){toast(e.message,true)}}
async function holidayDay(){const reason=prompt("Holiday reason (optional):","Holiday");if(reason===null)return;try{await api("/api/attendance/holiday",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reason})});toast("Today declared a holiday.");load()}catch(e){toast(e.message,true)}}load();
</script></body></html>
